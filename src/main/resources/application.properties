spring.application.name=remindly

# Loading environment variables file
spring.config.import=optional:file:.env[.properties]

# Database connection config
spring.datasource.url=${DB_URL:jdbc:h2:file:${user.home}/.remindly/data/remindly;AUTO_SERVER=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.main.banner-mode=off
spring.main.web-application-type=none
spring.main.log-startup-info=false

spring.output.ansi.enabled=never

# Logs config
logging.level.org.hibernate=OFF
#logging.pattern.console=

# MCP Server Config
spring.ai.mcp.server.name=remindly-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.enable=true
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.request-timeout=60s

spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
